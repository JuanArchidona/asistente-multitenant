# Blueprint de Render para la interfaz desplegada (app.py).
# En el dashboard: New > Blueprint > este repositorio. Render lee este fichero,
# crea el servicio y pide los valores marcados con `sync: false`.
#
# Decisiones, con su porque en docs/DESPLIEGUE.md:
# - Plan gratuito: el servicio se duerme sin trafico y el disco es efimero.
#   El indice se reconstruye en el primer arranque desde el corpus versionado.
# - Los usuarios van en APP_USUARIOS_JSON (el contenido de usuarios.local.json)
#   y el startCommand de abajo los escribe a disco antes de arrancar si el
#   fichero no existe. Sin esa variable, la app arranca con las credenciales de
#   ejemplo y lo dice en pantalla. Activada el 23-09-2026 (E-0007).
# - TOPE_GASTO_USD es el tope blando de la interfaz. El duro es el prepago.
services:
  - type: web
    name: asistente-multitenant
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: uv sync --frozen --no-dev --group app
    startCommand: >-
      sh -c 'if [ -n "$APP_USUARIOS_JSON" ] && [ ! -f usuarios.local.json ]; then printf "%s" "$APP_USUARIOS_JSON" > usuarios.local.json; fi;
      uv run streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true'
    healthCheckPath: /
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_USUARIOS_JSON
        sync: false
      - key: TOPE_GASTO_USD
        value: "2.0"
      - key: ANTHROPIC_MODEL_ROUTER
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_MODEL_GENERATOR
        value: claude-haiku-4-5-20251001
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: ROUTER_TEMPERATURE
        value: "0"
      - key: CHROMA_PATH
        value: data/chroma
      - key: CORPUS_PATH
        value: corpus
      - key: TOP_K
        value: "4"

  # Canal de WhatsApp (docs/CANAL_WHATSAPP.md). Mismo repositorio, otro
  # arranque. El blueprint se sincroniza solo con cada push, asi que el
  # servicio se creo al publicarlo y fallo a proposito: sin los valores
  # WHATSAPP_* de la app de Meta el servidor no arranca (un webhook sin firma
  # acepta mensajes de cualquiera). autoDeploy en falso hasta que existan las
  # credenciales; entonces se despliega a mano desde el dashboard.
  - type: web
    name: asistente-whatsapp
    runtime: python
    region: frankfurt
    plan: free
    autoDeploy: false
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run python -m src.canal_whatsapp_servidor
    healthCheckPath: /salud
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_USUARIOS_JSON
        sync: false
      - key: TOPE_GASTO_USD
        value: "2.0"
      - key: ANTHROPIC_MODEL_ROUTER
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_MODEL_GENERATOR
        value: claude-haiku-4-5-20251001
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: ROUTER_TEMPERATURE
        value: "0"
      - key: CHROMA_PATH
        value: data/chroma
      - key: CORPUS_PATH
        value: corpus
      - key: TOP_K
        value: "4"
