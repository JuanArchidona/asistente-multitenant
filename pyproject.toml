[project]
name = "evaluacion-agentes"
version = "0.1.0"
description = "Banco de pruebas y evaluación del asistente RAG con enrutador - Módulo 3.3"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "google-genai>=1.73.0",
    "chromadb>=0.5.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pypdf>=6.14.2",
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
]
# Juez LLM. Se instala aparte porque arrastra bastante y el gate de CI
# (ruff + pytest con proveedor mockeado) no lo necesita.
judge = [
    "deepeval>=3.0.0",
]
# Interfaz desplegada (app.py). Aparte por el mismo motivo: ni el banco ni
# la CI la necesitan. Render instala con `uv sync --frozen --no-dev --group app`.
app = [
    "streamlit>=1.60.0",
]
# Prototipo de orquestación con LangGraph (src/orquestacion_langgraph.py),
# solo para la comparativa medida del capítulo 3.1 de la memoria
# (HALLAZGOS.md §50). Ni el producto, ni el banco ni la CI lo necesitan:
# se activa con ORQUESTADOR=langgraph tras `uv sync --group langgraph`.
langgraph = [
    "langgraph>=1.2.12",
]
# Procesado del material del máster (vídeos de tutoría y adjuntos del campus):
# descarga, transcripción local en CPU y extracción de texto de pptx/docx/pdf.
# El material y sus transcripciones viven fuera del repositorio (es público);
# aquí solo están las herramientas. `uv sync --group material`.
material = [
    "yt-dlp>=2026.8.19",
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.6.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "pypdf>=6.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Las pruebas importan `src` y `evals` del repo, no de un paquete instalado.
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "evals"]
